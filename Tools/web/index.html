<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorldGen · 描述一句话，生成可玩场景</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23101418'/%3E%3Ctext x='8' y='12' font-size='10' font-weight='700' text-anchor='middle' fill='%2334b39a'%3EW%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">World<em>Gen</em><span data-i18n="brand_sub"></span></div>
  <div class="top-right">
    <span id="lang-switch" class="lang-switch"></span>
    <span id="queue-chip" class="chip hidden"></span>
    <span id="status-chip" class="chip" data-i18n="status_idle"></span>
  </div>
</header>

<main>

  <!-- ============================== VIEW 1: 输入 ============================== -->
  <section id="view-input" class="view">
    <div class="hero">
      <h1 data-i18n="hero_title"></h1>
      <p class="hero-sub" data-i18n="hero_sub"></p>
      <textarea id="desc" rows="4" data-i18n-ph="desc_ph"></textarea>
      <button id="btn-generate" class="btn-primary big" data-i18n="btn_generate"></button>

      <div class="examples">
        <span class="ex-label" data-i18n="ex_label"></span>
        <button class="ex-chip" data-key="A" data-i18n="ex_a"></button>
        <button class="ex-chip" data-key="B" data-i18n="ex_b"></button>
        <button class="ex-chip" data-key="C" data-i18n="ex_c"></button>
      </div>
      <p class="ex-note" data-i18n-html="ex_note"></p>
      <div id="archives" class="archives hidden"></div>
      <div id="input-error" class="error hidden"></div>
    </div>
  </section>

  <!-- ============================= VIEW 2: 生成中 ============================= -->
  <section id="view-run" class="view hidden">
    <div class="run-wrap">
      <h2 id="run-title" data-i18n="run_title"></h2>
      <p id="run-sub" data-i18n="run_sub"></p>
      <ol id="stages" class="stages"></ol>
      <div id="run-fail" class="fail-card hidden">
        <div class="fail-head" data-i18n="fail_title"></div>
        <div id="fail-reason"></div>
        <div class="fail-actions">
          <button id="btn-retry" class="btn-primary" data-i18n="btn_retry"></button>
          <button id="btn-back" class="btn-ghost" data-i18n="btn_back"></button>
        </div>
      </div>
      <div id="run-tech" class="tech">
        <div class="tech-head" data-toggle="run-tech"><span data-i18n="tech_head_run"></span><span class="arrow">▼</span></div>
        <div class="tech-body" id="run-tech-body"></div>
      </div>
    </div>
  </section>

  <!-- ============================= VIEW 3: 结果 ============================= -->
  <section id="view-result" class="view hidden">
    <div class="result-grid">
      <div class="stage-left">
        <div class="badge-row"><span id="result-badge" class="badge"></span></div>
        <div class="main-frame"><img id="main-preview" alt="scene preview"></div>
        <div class="view-tabs" id="view-tabs"></div>
        <div class="result-actions">
          <button id="btn-open" class="btn-primary" data-i18n="btn_open"></button>
          <button id="btn-play" class="btn-secondary" data-i18n="btn_play"></button>
          <button id="btn-new" class="btn-ghost" data-i18n="btn_new"></button>
        </div>
        <div id="clip-box" class="clip-box hidden">
          <video id="clip-video" controls preload="metadata"></video>
          <p class="clip-cap" id="clip-cap"></p>
        </div>
      </div>
      <aside class="stage-right">
        <h3 id="res-title"></h3>
        <div class="sub" id="res-sub"></div>
        <dl class="facts" id="res-facts"></dl>
        <div class="obj-list" id="res-objects"></div>
        <div class="play-hint" data-i18n-html="play_hint"></div>
      </aside>
    </div>
    <div id="result-tech" class="tech">
      <div class="tech-head" data-toggle="result-tech"><span data-i18n="tech_head_result"></span><span class="arrow">▼</span></div>
      <div class="tech-body" id="result-tech-body"></div>
    </div>
  </section>

</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span id="modal-title"></span>
      <button id="modal-close" class="btn-ghost" data-i18n="modal_close"></button>
    </div>
    <pre id="modal-body"></pre>
  </div>
</div>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
